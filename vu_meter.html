<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
body { background-color: #050505; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100vh; font-family: sans-serif; }
.console { background: #1a1a1a; padding: 25px; border-radius: 12px; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; gap: 15px; }
.display-row { display: flex; gap: 20px; align-items: flex-end; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.label { color: #eee; font-weight: bold; font-size: 16px; font-family: sans-serif; }
/* 窓の表示の大きさ。中身 (VUは280x145、スコープは220x220で描く) をまるごと拡大縮小する */
:root{ --vuK: 0.92; --scopeK: 1.09; }
.meter { position: relative; width: calc(280px * var(--vuK)); height: calc(145px * var(--vuK)); background-color: #fdfae1; overflow: hidden; border-radius: 4px; border: 1px solid #444; }
.meterInner { position: absolute; left: 0; top: 0; width: 280px; height: 145px; transform-origin: 0 0; transform: scale(var(--vuK)); }
.scope { position: relative; width: calc(220px * var(--scopeK)); height: calc(220px * var(--scopeK)); background-color: #000; border: 1px solid #444; border-radius: 4px; overflow: hidden; }
.scopeInner { position: absolute; left: 0; top: 0; width: 220px; height: 220px; transform-origin: 0 0; transform: scale(var(--scopeK)); }
.needle {
    position: absolute;
    top: 181px;
    left: 140px;
    width: 0;
    height: 150px;
    margin-top: -150px;
    transform-origin: bottom center;
    z-index: 10;
}

.needle::before {
    content: "";
    position: absolute;
    left: -3px;
    bottom: 0;
    width: 6px;
    height: 150px;
    background: #111;
    clip-path: polygon(
        33% 0%,
        67% 0%,
        100% 100%,
        0% 100%
    );
}
    
.controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; color: #aaa; margin-top: 10px; }
.knob-group { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; }
select { background: #333; color: #fff; border: 1px solid #555; padding: 5px; border-radius: 4px; width: 200px; margin-bottom: 10px; }
input[type=range] { width: 130px; cursor: pointer; }
#btn { padding: 10px 0; width: 140px; flex-shrink: 0; white-space: nowrap; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; background: #444; color: white; }
#btn.on { background: #d00; }
canvas { position: absolute; top: 0; left: 0; z-index: 5; }
    .rta-window {
    width:760px;
    height:260px;
    background:#050505;
    border:1px solid #444;
    box-sizing:border-box;
}

#rtaCanvas {
    position:static;
    display:block;
}
    .rta-panel{
    background:#1a1a1a;
    border:2px solid #333;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}
.pbtn{
    width:74px;
    height:28px;
    padding:0;
    box-sizing:border-box;
    background:#2a2a2a;
    color:#ddd;
    border:1px solid #555;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1px;
    cursor:pointer;
    transition:background .12s, border-color .12s;
}
.pbtn:hover{ background:#383838; border-color:#777; }
.pbtn:active{ background:#1c1c1c; }
.pbtn.on{ background:#0a7a3c; border-color:#16c060; color:#fff; }
.pbtn.tab{ width:104px; }
/* 入力選択の箱と同じ見た目のボタン (LR / LL) */
.selbtn{ background:#333; color:#999; border:1px solid #555; border-radius:4px; padding:5px 0; width:40px; font-size:13px; font-weight:bold; cursor:pointer; }
.selbtn.on{ background:#555; color:#fff; border-color:#888; }
/* Rだけのレベル。いつも暗めの灰色 */
input[type=range].rTrim{ accent-color:#5a5a5a; filter:grayscale(1) brightness(0.75); }
#vuValR{ color:#777; font-size:12px; font-variant-numeric:tabular-nums; }
.tpBox{ display:flex; flex-direction:column; gap:3px; margin-left:6px; font-size:12px; line-height:1; color:#888; font-variant-numeric:tabular-nums; white-space:nowrap; text-align:left; }
.tpBox .tpLab{ display:inline-block; width:46px; }
.tpBox .tpNum{ display:inline-block; width:40px; text-align:right; }
.loudCol{ display:flex; flex-direction:column; align-items:center; gap:6px; width:52px; }
.loudName{ font-size:12px; color:#aaa; }
.loudNum{ font-size:15px; color:#ccc; font-variant-numeric:tabular-nums; white-space:nowrap; }
.loudTrack{ width:20px; height:220px; background:#222; position:relative; }
#vuVal, #scopeVal{
    color:#888;
    font-size:12px;
    font-variant-numeric:tabular-nums;
}
#mainPanel{
    transform-origin: top center;
}
    
</style>
</head>
<body>
    <div id="mainPanel">
<div class="console">
  

<div class="display-row">
    <div class="unit" id="vuGroup">
<div style="display:flex; align-items:flex-end; gap:70px;">
    <button id="btn">POWER OFF</button>

    <div class="knob-group">
        <label style="color:#0f0">
            SELECT INPUT DEVICE:
        </label>

        <div style="display:flex; gap:6px; align-items:flex-start;">
            <select id="micSelect">
                <option value="">
                    -- Device List --
                </option>
            </select>
            <button id="modeStereo" class="selbtn" title="ステレオ (L→L、R→R)">LR</button>
            <button id="modeMono" class="selbtn" title="モノラル (L を両方へ)">LL</button>
        </div>
        <div id="latVal" style="font-size:11px; color:#888; height:14px; width:292px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; font-variant-numeric:tabular-nums;"></div>
    </div>

</div>
<div style="height:20px;"></div>
        
   <div style="display:flex; gap:18px; align-items:flex-start; margin-bottom:2px;">
   <div style="display:flex; flex-direction:column; align-items:center;">
    <input type="range" id="vuGainCoarse" min="0" max="40" step="1" value="20">
    <input type="range" id="vuGainFine" min="-1" max="1" step="0.1" value="0">
    <span id="vuVal">0.0 dB</span>
   </div>
   <div style="display:flex; flex-direction:column; align-items:center;">
    <input type="range" class="rTrim" id="vuGainCoarseR" min="0" max="40" step="1" value="20">
    <input type="range" class="rTrim" id="vuGainFineR" min="-1" max="1" step="0.1" value="0">
    <span id="vuValR">R +0.0 dB</span>
   </div>
   </div>

<div style="display:flex; gap:20px; align-items:flex-start;">

    <div class="unit">
        <div class="label">L-VU</div>
        <div class="meter">
            <div class="meterInner">
            <canvas id="cvsL" width="280" height="145"></canvas>
            <div id="ndlL" class="needle"></div>
            </div>
        </div>
    </div>

    <div class="unit">
        <div class="label">R-VU</div>
        <div class="meter">
            <div class="meterInner">
            <canvas id="cvsR" width="280" height="145"></canvas>
            <div id="ndlR" class="needle"></div>
            </div>
        </div>
    </div>

</div>
</div>
   <div class="unit">

        <input type="range" id="scopeGain" min="0.1" max="5.0" step="0.1" value="1.0">
        <span id="scopeVal">x1.0</span>

        <div class="label">PHASE SCOPE</div>

        <div class="scope">
            <div class="scopeInner"><canvas id="cvsScope" width="220" height="220"></canvas></div>
        </div>

    </div>

    <div class="unit" style="width:112px;">
        <div class="label">LOUDNESS</div>

        <div style="display:flex; gap:4px; align-items:flex-end;">
            <div class="loudCol">
                <div class="loudName">M</div>
                <div class="loudTrack" style="height:220px;">
                    <div id="barM" style="position:absolute; bottom:0; width:100%; height:0%;"></div>
                    <div class="loudTgt" style="position:absolute; left:-3px; right:-3px; height:1px; background:#fff;"></div>
                </div>
                <div class="loudNum" id="mVal">--.-</div>
            </div>
            <div class="loudCol">
                <div class="loudName">S</div>
                <div class="loudTrack" style="height:220px;">
                    <div id="barS" style="position:absolute; bottom:0; width:100%; height:0%;"></div>
                    <div class="loudTgt" style="position:absolute; left:-3px; right:-3px; height:1px; background:#fff;"></div>
                </div>
                <div class="loudNum" id="sVal">--.-</div>
            </div>
        </div>
    </div>

</div>
        </div>
    
    
    
<div class="rta-panel">

    <div style="display:flex; align-items:center; gap:8px; width:760px;">
        <button id="tabRta" class="pbtn tab on">RTA</button>
        <button id="tabLoud" class="pbtn tab">LOUDNESS</button>
        <div class="tpBox">
            <div><span class="tpLab">TP 10s</span><span class="tpNum" id="tpRecentVal">--.-</span> dBTP</div>
            <div><span class="tpLab">TP MAX</span><span class="tpNum" id="tpMaxVal">--.-</span> dBTP</div>
        </div>
        <div style="flex:1;"></div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; white-space:nowrap; color:#0f0; line-height:1;">
            <span style="font-size:11px; color:#aaa; margin-bottom:2px;">INTEGRATED</span>
            <div><span id="lkfsVal" style="font-size:50px; font-weight:bold; font-variant-numeric:tabular-nums;">--.-</span><span style="font-size:18px;"> LKFS</span></div>
        </div>
        <div style="display:flex; gap:6px; margin-left:10px;">
            <button id="lkfsStart" class="pbtn">START</button>
            <button id="lkfsReset" class="pbtn">RESET</button>
        </div>
    </div>

    <div class="rta-window">
        <canvas id="rtaCanvas"
                width="760"
                height="260"></canvas>
    </div>

</div>



    
   
   
</div>

<script>
// Androidアプリの中で開いたときは、音をアプリから受け取る (アプリが NativeAudio を用意する)
const NATIVE = typeof window.NativeAudio !== "undefined";

const FIT_TOP = 20;        // 画面の上端とのあいだの余白 (px)
const FIT_RATIO = 0.85;    // 画面に対する全体の大きさ (1で画面いっぱい)
let fitW = 0;

// 全体を画面に収まる大きさにする
function fitScreen(){

    const panel =
        document.getElementById("mainPanel");

    panel.style.marginTop = FIT_TOP + "px";
    panel.style.transform = "scale(1)";

    const rect =
        panel.getBoundingClientRect();

    fitW = document.documentElement.clientWidth;

    const scaleX =
        fitW / rect.width;

    const scaleY =
        (window.innerHeight - FIT_TOP) / rect.height;

    const scale =
        Math.min(scaleX, scaleY) * FIT_RATIO;

    panel.style.transform =
        `scale(${scale})`;

    scopeResize();
}

// スコープの絵を、実際に表示される細かさで描く (拡大でぼやけないように)
let SCOPE_RES = 1;   // スコープ1pxあたりの画面上の実ピクセル数
function scopeResize(){
    const cv = document.getElementById("cvsScope");
    if (!cv) return;
    cv.style.width = "220px"; cv.style.height = "220px";
    const k = cv.getBoundingClientRect().width / 220 * (window.devicePixelRatio || 1);
    const px = Math.max(220, Math.round(220 * k));
    if (cv.width !== px) { cv.width = px; cv.height = px; }
    SCOPE_RES = cv.width / 220;
}

// 合わせるのは、開いたときと、横幅が変わったとき(回転など)だけ。
// アドレスバーの出入りや指での拡大では、高さしか変わらないので動かさない
window.addEventListener("load", fitScreen);
window.addEventListener("resize", () => {
    if (document.documentElement.clientWidth !== fitW) fitScreen();
});
window.addEventListener("orientationchange", () => setTimeout(fitScreen, 300));
// ===== 画面のスリープ防止 =====
// 2段構え。(1) ブラウザに「画面を消さないで」と頼む (Wake Lock)。
// (2) 断られる機種もあるので、音のない小さな動画を裏で流し続けて、画面を起こしておく。

// 状態の表示: WL = Wake Lockが効いている / VID = 動画で起こしている / NO = どちらも効いていない / -- = まだ試していない
let wakeLock = null, keepAwakeState = "--", videoAwake = false;
function updateAwakeState(){
    keepAwakeState = wakeLock ? "WL" : videoAwake ? "VID" : "NO";
}
async function requestWakeLock(){
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; updateAwakeState(); });
    } catch (e) {}
    updateAwakeState();
}

function keepAwake(){
    if (NATIVE) { keepAwakeState = "APP"; return; }   // アプリが画面を消さないようにしている
    requestWakeLock().then(() => {
        if (wakeLock) {
            if (!keepAwakeVideo.paused) keepAwakeVideo.pause();
            videoAwake = false; updateAwakeState();
            return;
        }
        keepAwakeVideo.play().then(() => {
            videoAwake = true; updateAwakeState();
        }).catch(() => {
            videoAwake = false; updateAwakeState();
        });
    });
}
// 画面に触れたとき、POWER ON のとき、裏から戻ったときに、毎回頼み直す
document.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') keepAwake();
});

// ===== VUの文字盤 (針の角度・軸・目盛りの位置は実機に合わせてある。見た目は独自) =====
const VU_W = 280, VU_H = 145;
// 校正: 1kHz の正弦波を -20dBFS で入れたとき、ちょうど 0VU を指すようにする値
// (正弦波の絶対値の平均は ピーク×2/π。-20dBFS = ピーク0.1 → 20log10(1 / (0.1×2/π)) = 23.92)
const VU_CAL = 20 * Math.log10(1 / (0.1 * 2 / Math.PI));
const CX = 140, CY = 181;                 // 針の軸。窓の下端より31px下
const START_DEG = 133, END_DEG = 47;      // 針が振れる範囲 (水平から測って左右とも47度)
const VU_ARC_R = 140;                     // 振り切り位置での、針の軸から弧までの距離
const VU_ARC_DROP = 30;                   // 弧の中心を、針の軸からどれだけ下げるか。大きいほど平たい (0で同心円)
const VU_LABEL_GAP = 26;                  // 弧から数字までの距離

// 各目盛りが、振れ幅全体のどこにあるか (0 = 音なしの位置、1 = +3)。写真から測った値
const VU_SCALE = [
    [-20, 0.030], [-10, 0.135], [-7, 0.222], [-5, 0.303], [-3, 0.418], [-2, 0.489],
    [-1, 0.567], [0, 0.654], [1, 0.765], [2, 0.888], [3, 1.000]
];
// 電圧 → 振れ幅。目盛りと目盛りの間は直線でつなぐ
const VU_PTS = [[0, 0]].concat(VU_SCALE.map(m => [Math.pow(10, m[0] / 20), m[1]]));
function vuFrac(v){
    if (!(v > 0)) return 0;
    for (let i = 1; i < VU_PTS.length; i++) {
        if (v <= VU_PTS[i][0]) {
            const a = VU_PTS[i - 1], b = VU_PTS[i];
            return a[1] + (b[1] - a[1]) * (v - a[0]) / (b[0] - a[0]);
        }
    }
    return 1;
}
function dbToAngle(db){
    return START_DEG + vuFrac(Math.pow(10, db / 20)) * (END_DEG - START_DEG);
}

// 弧の形。両端 (振り切りの位置) は軸から VU_ARC_R の場所を通り、中心は軸の VU_ARC_DROP 下にある
const VU_ARC_RAD = (() => {
    const a = START_DEG * Math.PI / 180;
    return Math.hypot(Math.cos(a) * VU_ARC_R, Math.sin(a) * VU_ARC_R + VU_ARC_DROP);
})();
// 針の軸から、deg の方向に進んで弧に当たるまでの距離
function vuArcDist(deg){
    const s = Math.sin(deg * Math.PI / 180);
    return -VU_ARC_DROP * s + Math.sqrt(VU_ARC_RAD * VU_ARC_RAD - VU_ARC_DROP * VU_ARC_DROP * (1 - s * s));
}

function drawVUBase(canvasId) {
    const ctx = document.getElementById(canvasId).getContext("2d");
    ctx.clearRect(0, 0, VU_W, VU_H);
    const BLACK = "#222", RED = "#d00", SOFT = "#9a9a90";
    const rad = deg => -deg * Math.PI / 180;
    // 針の軸から deg の方向へ、弧から extra だけ外 (マイナスなら内) の点
    const pt = (deg, extra) => {
        const r = vuArcDist(deg) + extra;
        return [CX + Math.cos(rad(deg)) * r, CY + Math.sin(rad(deg)) * r];
    };
    const arcLine = (fromDeg, toDeg, extra, color, width) => {
        ctx.beginPath();
        const n = 80;
        for (let i = 0; i <= n; i++) {
            const d = fromDeg + (toDeg - fromDeg) * i / n;
            const q = pt(d, extra);
            if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]);
        }
        ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
    };

    // 弧。音なしの位置〜0 は黒の細い線、0〜+3 は赤い帯
    arcLine(START_DEG, dbToAngle(0), 0, BLACK, 1.5);
    arcLine(dbToAngle(0), dbToAngle(3), 2.5, RED, 5);

    // 目盛りと数字
    ctx.font = "bold 15px Arial"; ctx.textAlign = "center";
    VU_SCALE.forEach(m => {
        const v = m[0], deg = dbToAngle(v), color = v >= 0 ? RED : BLACK;
        const a = pt(deg, 0), b = pt(deg, v >= 0 ? 13 : 10);
        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.2;
        ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
        const txt = String(Math.abs(v));
        const t = pt(deg, VU_LABEL_GAP);
        const half = ctx.measureText(txt).width / 2;
        ctx.fillStyle = color;
        ctx.fillText(txt, Math.max(4 + half, Math.min(VU_W - 4 - half, t[0])), t[1] + 5);
    });

    // 弧の内側のパーセント目盛り (100% = 0VU)。目立たない色で控えめに
    ctx.font = "8px Arial"; ctx.fillStyle = SOFT;
    [0, 20, 40, 60, 80, 100].forEach(pc => {
        const deg = START_DEG + vuFrac(pc / 100) * (END_DEG - START_DEG);
        const d = pt(deg, -5);
        ctx.beginPath(); ctx.arc(d[0], d[1], 0.9, 0, Math.PI * 2); ctx.fill();
        const t = pt(deg, -14);
        ctx.fillText(pc === 100 ? "100%" : String(pc), t[0], t[1] + 3);
    });

    // − と ＋ と VU
    ctx.font = "bold 13px Arial";
    let t = pt(dbToAngle(-20), -24); ctx.fillStyle = BLACK; ctx.fillText("−", t[0] + 6, t[1] + 6);
    t = pt(dbToAngle(3), -24);       ctx.fillStyle = RED;   ctx.fillText("+", t[0] - 6, t[1] + 6);
    ctx.font = "bold 18px Arial"; ctx.fillStyle = BLACK;
    ctx.fillText("VU", CX, VU_H - 14);
}

const LOUD_MAX = -10;               // バーと履歴グラフの上端 (LKFS)
const LOUD_BAR_SEC = 3;              // 履歴グラフのバー1本の秒数
const LOUD_HIST_MIN = 12;            // 履歴グラフ全体の長さ (分)
const LOUD_HIST_BARS = LOUD_HIST_MIN * 60 / LOUD_BAR_SEC;   // バーの本数

// 色の変わり目 [LKFS, [R,G,B]]。バーの高さ方向のグラデーションになる
// いちばん下の色は、それより下ぜんぶに使う
const LOUD_COLORS = [
    [-49, [ 45, 125, 150]],   // 緑よりの青 (ここから下はこの色)
    [-43, [ 55, 165,  95]],   // 緑
    [-35, [ 85, 175,  85]],   // 緑 (ここまで緑を保つ)
    [-28, [150, 195,  60]],   // 黄緑

    [-14, [222,  58,  42]]    // 赤 (ここから上は赤)
];

// 色の変わり目を、表示範囲の中の位置(0〜1)に直す
function loudStops(){
    return LOUD_COLORS.map(c => [
        Math.max(0, Math.min(1, (c[0] - LOUD_MIN) / (LOUD_MAX - LOUD_MIN))),
        `rgb(${c[1]})`
    ]);
}

// K特性フィルター (ITU-R BS.1770)。サンプルレートに合わせて係数を作る
class LoudBiquad {
    constructor(b, a){
        this.b0 = b[0]; this.b1 = b[1]; this.b2 = b[2];
        this.a1 = a[0]; this.a2 = a[1];
        this.x1 = this.x2 = this.y1 = this.y2 = 0;
    }
    run(x){
        const y = this.b0 * x + this.b1 * this.x1 + this.b2 * this.x2
                - this.a1 * this.y1 - this.a2 * this.y2;
        this.x2 = this.x1; this.x1 = x;
        this.y2 = this.y1; this.y1 = y;
        return y;
    }
}

function makeKWeight(rate){
    // 高域シェルフ
    let K = Math.tan(Math.PI * 1681.974450955533 / rate);
    let Q = 0.7071752369554196;
    const Vh = Math.pow(10, 3.999843853973347 / 20);
    const Vb = Math.pow(Vh, 0.4996667741545416);
    let a0 = 1 + K / Q + K * K;
    const shelf = {
        b: [(Vh + Vb * K / Q + K * K) / a0, 2 * (K * K - Vh) / a0, (Vh - Vb * K / Q + K * K) / a0],
        a: [2 * (K * K - 1) / a0, (1 - K / Q + K * K) / a0]
    };
    // 低域カット
    K = Math.tan(Math.PI * 38.13547087602444 / rate);
    Q = 0.5003270373238773;
    a0 = 1 + K / Q + K * K;
    const hp = {
        b: [1, -2, 1],
        a: [2 * (K * K - 1) / a0, (1 - K / Q + K * K) / a0]
    };
    return { shelf, hp };
}

function toLkfs(e){
    return e > 0 ? -0.691 + 10 * Math.log10(e) : -120;
}

let loudM = -120, loudS = -120;     // いまのM / S
let loudI = null;                   // 積算値 (STARTを押すまで null)
let loudRun = false;                // 積算中かどうか
let loudRunBlocks = 0;
const loudRing = [];                // 10msごとのパワー。直近3秒分だけ持つ
const loudHist = [];                // 履歴グラフ用。確定したバーの値だけ持つ
let loudHistCnt = 0;                // 進行中のバーが何個ぶんの100msを数えたか
let loudDirty = true;               // 履歴グラフを描き直す必要があるか

// 文字が変わったときだけ画面を書き換える (毎回書き換えると無駄に重い)

// 積算用のレベル別集計表 (-70 〜 +10 LKFS を 0.1 刻み)。大きさは固定
const GATE_BINS = 800;
const gateCnt = new Float64Array(GATE_BINS);
const gateSum = new Float64Array(GATE_BINS);

function loudReset(){
    gateCnt.fill(0);
    gateSum.fill(0);
    loudI = null;
    loudRunBlocks = 0;
    tpMaxLin = 0;
}

// TP-BEGIN
// ===== トゥルーピーク (ITU-R BS.1770 の考え方: 4倍に細かくして、点と点の間の山まで見る) =====
const TP_HOLD_SEC = 10;      // 「直近」の最大値を残す秒数
const TP_WARN = -1;          // これを超えたら数字の色を変える (dBTP)
const TP_OS = 4, TP_TAPS = 12;   // 4倍に細かくする。1相あたり12タップ

// 補間フィルター (窓つきsinc)。4つの相に分けて持つ
const TP_PHASES = (() => {
    const N = TP_OS * TP_TAPS, beta = 5.0, fc = 0.92;
    const i0 = x => { let s = 1, t = 1; for (let k = 1; k < 30; k++) { t *= (x / (2 * k)) ** 2; s += t; } return s; };
    const h = [];
    for (let n = 0; n < N; n++) {
        const t = (n - N / 2) / TP_OS;
        const sinc = t === 0 ? 1 : Math.sin(Math.PI * fc * t) / (Math.PI * fc * t);
        const r = (n - N / 2) / (N / 2);
        const w = Math.abs(r) <= 1 ? i0(beta * Math.sqrt(1 - r * r)) / i0(beta) : 0;
        h.push(fc * sinc * w);
    }
    const ph = [];
    for (let p = 0; p < TP_OS; p++) {
        const c = new Float64Array(TP_TAPS);
        let s = 0;
        for (let j = 0; j < TP_TAPS; j++) { c[j] = h[p + TP_OS * j]; s += c[j]; }
        for (let j = 0; j < TP_TAPS; j++) c[j] /= s;    // 直流の利得を1にそろえる
        ph.push(c);
    }
    return ph;
})();

// 直近の音を覚えておく箱 (左右それぞれ)
function tpMakeState(){ return { buf: new Float64Array(TP_TAPS * 2), pos: 0 }; }
let tpStL = tpMakeState(), tpStR = tpMakeState();

// 1チャンネルぶんの音を流して、細かくした波の最大値(絶対値)を返す
function tpRun(st, x){
    const buf = st.buf, T = TP_TAPS;
    let pos = st.pos, peak = 0;
    for (let i = 0; i < x.length; i++) {
        const v = x[i];
        buf[pos] = v; buf[pos + T] = v;          // 2重に持って、折り返しの計算を省く
        pos = (pos + 1) % T;
        for (let p = 0; p < TP_OS; p++) {
            const c = TP_PHASES[p];
            let acc = 0;
            for (let j = 0; j < T; j++) acc += c[j] * buf[pos + T - 1 - j];
            const a = acc < 0 ? -acc : acc;
            if (a > peak) peak = a;
        }
    }
    st.pos = pos;
    return peak;
}

const tpRecent = [];      // [時刻, 最大値] を直近 TP_HOLD_SEC 秒ぶん
let tpMaxLin = 0;         // STARTからの最大値 (RESETで0)

function tpFeed(L, R, now, running){
    const pk = Math.max(tpRun(tpStL, L), tpRun(tpStR, R));
    tpRecent.push([now, pk]);
    while (tpRecent.length && tpRecent[0][0] < now - TP_HOLD_SEC) tpRecent.shift();
    if (running && pk > tpMaxLin) tpMaxLin = pk;
}
function tpRecentLin(){
    let m = 0;
    for (const e of tpRecent) if (e[1] > m) m = e[1];
    return m;
}
const tpDb = lin => lin > 1e-6 ? 20 * Math.log10(lin) : -Infinity;
// TP-END

// 400msブロックを1個、積算に加える
function loudAddBlock(e){
    const l = toLkfs(e);
    if (l <= -70) return;                               // 絶対ゲート
    const idx = Math.min(GATE_BINS - 1, Math.floor((l + 70) * 10));
    gateCnt[idx]++;
    gateSum[idx] += e;

    let n = 0, s = 0;
    for (let i = 0; i < GATE_BINS; i++) { n += gateCnt[i]; s += gateSum[i]; }
    if (!n) return;

    const rel = toLkfs(s / n) - 10;                     // 相対ゲート
    const from = Math.max(0, Math.ceil((rel + 70) * 10 - 1e-9));
    n = 0; s = 0;
    for (let i = from; i < GATE_BINS; i++) { n += gateCnt[i]; s += gateSum[i]; }
    if (n) loudI = toLkfs(s / n);
}

// 10msぶんのパワー(L+R)を受け取る。
// M (400ms) と S (3秒) は10msごとに更新する (短い音の山を取りこぼさないように)。
// 積算のゲートは規格どおり、400msのブロックを100msごとに作る
let loudTick = 0;      // 10msの数え (10回で100ms)
function loudPush(e){
    loudRing.push(e);
    if (loudRing.length > 300) loudRing.shift();

    const len = loudRing.length;
    let s40 = 0, s300 = 0;
    for (let i = 0; i < len; i++) {
        s300 += loudRing[i];
        if (i >= len - 40) s40 += loudRing[i];
    }
    loudM = toLkfs(s40 / Math.min(40, len));
    loudS = toLkfs(s300 / len);
    loudDirty = true;

    if (++loudTick < 10) return;            // ここから下は100msごと
    loudTick = 0;

    // 3秒たったら、その3秒ぶんの値をバー1本として確定する
    if (++loudHistCnt >= LOUD_BAR_SEC * 10) {
        loudHistCnt = 0;
        loudHist.push(loudS);
        if (loudHist.length > LOUD_HIST_BARS - 1) loudHist.shift();
    }

    if (loudRun && ++loudRunBlocks >= 4) loudAddBlock(s40 / Math.min(40, len));
}

// 履歴グラフ (RTAの枠に描く)
let rtaMode = "rta";

function drawLoudHistory(){
    const cv = document.getElementById("rtaCanvas");
    const g = cv.getContext("2d");
    const pitch = 3;     // 3秒ぶんの横幅(px)
    const x1 = cv.width - 10, x0 = x1 - LOUD_HIST_BARS * pitch;
    const yTop = 10, yBot = 220;
    const yOf = v => yBot - (v - LOUD_MIN) / (LOUD_MAX - LOUD_MIN) * (yBot - yTop);

    g.fillStyle = "#050505";
    g.fillRect(0, 0, cv.width, cv.height);

    g.font = "12px sans-serif";
    g.lineWidth = 1;
    g.textAlign = "right";
    for (let v = LOUD_MIN; v <= LOUD_MAX; v += 10) {
        g.strokeStyle = "rgba(255,255,255,0.12)";
        g.beginPath(); g.moveTo(x0, yOf(v)); g.lineTo(x1, yOf(v)); g.stroke();
        g.fillStyle = "#aaa";
        g.fillText(v, x0 - 6, yOf(v) + 4);
    }

    const grad = g.createLinearGradient(0, yBot, 0, yTop);
    loudStops().forEach(st => grad.addColorStop(st[0], st[1]));
    g.fillStyle = grad;

    // 3秒ごとの値を点にして、なめらかな曲線でつなぎ、その下を塗る
    // 右端が進行中の値 (リアルタイム)。左へ行くほど古い
    const vals = loudHist.concat([loudS]);
    const pts = vals.map((v, k) => ({
        x: x1 - (vals.length - 1 - k + 0.5) * pitch,
        y: yOf(Math.max(LOUD_MIN, Math.min(LOUD_MAX, v)))
    }));
    g.beginPath();
    g.moveTo(pts[0].x, yBot);
    g.lineTo(pts[0].x, pts[0].y);
    for (let k = 1; k < pts.length; k++) {
        // 点と点の中間を通る曲線にすると、角が立たない
        const mx = (pts[k - 1].x + pts[k].x) / 2;
        const my = (pts[k - 1].y + pts[k].y) / 2;
        g.quadraticCurveTo(pts[k - 1].x, pts[k - 1].y, mx, my);
    }
    const last = pts[pts.length - 1];
    g.lineTo(last.x, last.y);
    g.lineTo(x1, last.y);
    g.lineTo(x1, yBot);
    g.closePath();
    g.fill();

    // 目標の線
    g.strokeStyle = "rgba(255,255,255,0.8)";
    g.beginPath(); g.moveTo(x0, yOf(LOUD_TARGET)); g.lineTo(x1, yOf(LOUD_TARGET)); g.stroke();
    g.fillStyle = "#fff";
    g.fillText(LOUD_TARGET, x0 - 6, yOf(LOUD_TARGET) + 4);

    g.fillStyle = "#aaa";
    g.textAlign = "center";
    for (let m = 0; m <= LOUD_HIST_MIN; m += 3) {
        g.fillText(m === 0 ? "0" : "-" + m + "分",
            x1 - m * 60 / LOUD_BAR_SEC * pitch, 245);
    }
}

async function getDevices() {
    if (NATIVE) {
        micSelect.innerHTML = '';
        JSON.parse(NativeAudio.devices()).forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id; opt.text = d.name;
            micSelect.appendChild(opt);
        });
        return;
    }
    const devices = await navigator.mediaDevices.enumerateDevices();
    micSelect.innerHTML = '';
    devices.filter(d => d.kind === 'audioinput').forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.text = d.label || `Microphone ${micSelect.length + 1}`;
        micSelect.appendChild(opt);
    });
}

else navigator.mediaDevices.getUserMedia({ audio: true }).then(s => {

    getDevices();
});

    const tr0 = stream.getAudioTracks()[0];

    const devSr = st0.sampleRate ? kHz(st0.sampleRate) + ">" : "";
 const latHead = NATIVE ? ("APP " + nativeInfo.mode + " / " + kHz(nativeInfo.sr) + "k " + nativeInfo.ch + "ch") :
        "IN " + ms(st0.latency) + " / " + ms(audioCtx.baseLatency) +

// 数字とガイド線はオクターブごと。バーの位置にぴったり合わせる
const rtaSnap = f => 1000 * Math.pow(2, Math.round(3 * Math.log2(f / 1000)) / 3);
const rtaLabels = [
    [20, "20"], [31.5, "31.5"], [63, "63"], [125, "125"], [250, "250"], [500, "500"],
    [1000, "1k"], [2000, "2k"], [4000, "4k"], [8000, "8k"], [16000, "16k"]
];
const guide = rtaLabels.slice(1).map(l => ({ f: rtaSnap(l[0]), strong: l[0] === 1000 }));

function freqX(freq){

    const min = 20;
    const max = 20000;

    return 30 +
       Math.log10(freq/min) /
       Math.log10(max/min) *
       (rtaCanvas.width - 60);
}


guide.forEach(g=>{

    rtaCtx.beginPath();

    rtaCtx.strokeStyle =
        g.strong ?
        "rgba(255,255,255,0.25)" :
        "rgba(255,255,255,0.12)";

    rtaCtx.moveTo(
        freqX(g.f),
        0
    );

    rtaCtx.lineTo(
        freqX(g.f),
        220
    );

    rtaCtx.stroke();

});


// バー描画（バンド内のパワー合算。ピンクノイズで平らになる）

const rtaDt = Math.min(0.1, (rtaNow - rtaLastT) / 1000);
rtaLastT = rtaNow;

const rtaStep =
    (rtaCanvas.width - 60) / (Math.log2(1000) * RTA_BANDS_PER_OCT);
const rtaBarW = Math.max(1, rtaStep * 0.8);

rtaCtx.fillStyle = "#777";

for (const band of rtaBandList) {

    const isLow = band.fc < RTA_SPLIT_HZ;
    if (isLow ? rtaLoNew : rtaHiNew) {
        band.raw = isLow ?
            rtaBandPower(rtaDataLow, rtaAnalyserLow.fftSize, band.f1, band.f2) :
            rtaBandPower(rtaData, rtaAnalyser.fftSize, band.f1, band.f2);
    }
    const p = band.raw;

    // 上がりは速く、下がりはゆっくり（画面の更新速度に左右されない）
    const tau = p > band.p ? RTA_ATTACK : RTA_RELEASE;
    band.p += (p - band.p) * (1 - Math.exp(-rtaDt / tau));

    const db = 10 * Math.log10(band.p + 1e-12);

    const h = Math.max(0, Math.min(220,
        (db - RTA_BOTTOM) / (RTA_TOP - RTA_BOTTOM) * 220));

    rtaCtx.fillRect(
        freqX(band.fc) - rtaBarW / 2,
        220 - h,
        rtaBarW,
        h
    );
}


// 周波数表示

rtaCtx.fillStyle="#aaa";
rtaCtx.font="12px sans-serif";
rtaCtx.textAlign="center";



// 1/3オクターブごとの小さい目盛り (オクターブの位置は長め)
rtaCtx.strokeStyle = "rgba(255,255,255,0.4)";
rtaCtx.lineWidth = 1;
rtaCtx.beginPath();
for (let k = -17; k <= 13; k++) {
    const x = Math.round(freqX(1000 * Math.pow(2, k / 3))) + 0.5;
    rtaCtx.moveTo(x, 221);
    rtaCtx.lineTo(x, k % 3 === 0 ? 229 : 225);
}
rtaCtx.stroke();

rtaLabels.forEach(l => {
    rtaCtx.fillText(l[1], freqX(rtaSnap(l[0])), 245);
});
        requestAnimationFrame(loop);
    }
    loop();
};
</script>
    </div>
</body>
