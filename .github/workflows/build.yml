name: build-apk
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Arrange files
        run: |
          mkdir -p w/app/src/main/java/jp/mok/vutest w/app/src/main/cpp
          cp *.java w/app/src/main/java/jp/mok/vutest/
          cp AndroidManifest.xml w/app/src/main/
          cp aaudio_jni.c CMakeLists.txt w/app/src/main/cpp/
          cat > w/settings.gradle <<'EOF2'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "VuTest"
          include ':app'
          EOF2
          cat > w/build.gradle <<'EOF2'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF2
          cat > w/gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx2g
          EOF2
          cat > w/app/build.gradle <<'EOF2'
          plugins { id 'com.android.application' }
          android {
              namespace 'jp.mok.vutest'
              compileSdk 34
              defaultConfig {
                  applicationId 'jp.mok.vutest'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '0.2'
                  ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
              }
              externalNativeBuild {
                  cmake { path 'src/main/cpp/CMakeLists.txt' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF2
      - name: Fixed signing key
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Build
        working-directory: w
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp w/app/build/outputs/apk/debug/app-debug.apk vu-test.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk vu-test.apk --title "VU TEST (latest build)" --notes "Built from ${GITHUB_SHA::7}"
